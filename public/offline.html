<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timestamp – offline</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #f7f6f1; color: #1c1e21;
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #16171a; color: #ecebe6; } }
    .kicker { font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 0.22em; color: #2742d6; }
    @media (prefers-color-scheme: dark) { .kicker { color: #7b8ff0; } }
    h1 { font-size: 20px; margin: 8px 0; }
    p { color: #8b8a82; font-size: 14px; max-width: 40ch; margin: 0 auto; }
  </style>
</head>
<body>
  <div>
    <div class="kicker">TIMESTAMP</div>
    <h1>Gerade offline</h1>
    <p>Keine Verbindung zum Server. Sobald du wieder online bist, lade die App neu – deine Einträge liegen sicher in der Datenbank.</p>
  </div>
</body>
</html>
