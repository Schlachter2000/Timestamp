<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilanz – offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f6f1;
        color: #1b1e1c;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #151714; color: #eceae2; }
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: 0.7; margin: 0; }
    </style>
  </head>
  <body>
    <div>
      <h1>Gerade offline</h1>
      <p>Die zuletzt geöffnete Seite ist nicht im Cache. Sobald du wieder Netz hast, lädt Bilanz normal – deine Einträge aus der Zwischenzeit werden automatisch synchronisiert.</p>
    </div>
  </body>
</html>
